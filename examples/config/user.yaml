# ==============================================================================
# jflow - Dual-Interface CLI & MCP Server for Jira Cloud
# Co-created through collaborative AI pair programming with Gemini.
# Refined / authored with assistance from Cursor (Grok).
# ==============================================================================
jira:
  # --- API token (default) ---
  auth: "api_token"
  domain: "your-domain.atlassian.net"
  email: "your-email@example.com"
  # Any string value may reference environment variables:
  #   ${VAR}            expand; error if unset
  #   ${VAR:-default}   fallback when unset or empty
  #   $$                literal "$" (so $${VAR} stays ${VAR})
  api_token: "${JIRA_API_TOKEN:-You-need-to-set-a-token}"
  # --- OAuth 2.0 (3LO); see docs/auth.md ---
  # auth: "oauth"
  # domain: "your-domain.atlassian.net"
  # oauth_client_id: "YOUR_CLIENT_ID"
  # oauth_client_secret: "YOUR_CLIENT_SECRET"
  # oauth_redirect_uri: "http://127.0.0.1:8391/callback"
  # oauth_cloud_id: null

defaults:
  project: "PROJ"
  issue_type: "Task"
  output_format: "markdown" # Options: markdown, text, unix, json, yaml (table is an alias for text)
  board: null  # Board id or name for sprint commands (e.g. "42" or "PROJ board")
  # Optional: which fields `jflow show` / `jflow issue show` fetch and display.
  # Names from `jflow cache sync` or raw ids (customfield_…). Unset = built-in set.
  # CLI --only overrides this list for one invocation.
  # show_fields:
  #   - summary
  #   - status
  #   - assignee
  #   - priority
  #   - description
  #   - Story Points
  #   - Git Pull Request

projects:
  PROJ:
    default_issue_type: "Task"
    issue_key: "PROJ-1"

templates:
  bug_report:
    summary: "[BUG] {component}: Issue in {env}"
    description: "Steps to reproduce:\n{steps}"
    issue_type: "Bug"
    labels: ["bug"]
    components: ["{component}"]
    # Optional named fields — use exact names from `jflow cache sync`
    # fields:
    #   "Environment": "QA"
    #   Sprint: "@current_sprint"  # requires defaults.board

jql_aliases:
  my-bugs: "assignee = currentUser() AND issuetype = Bug AND status != Closed"
  active-sprint: "project = PROJ AND sprint in openSprints()"
  project-open: "project = {project} AND status != Closed"
  # change MYUSERNAME to be your name, username, or email as seen by Jira.
  # also change the year as appropriate, q4 assumes you run it sometime in the following year.
  q1-2026-contributions: '(assignee = currentUser() AND resolved >= startOfYear() AND resolved < startOfYear("+3M")) OR issuekey in updatedBy("MYUSERNAME", "2026-01-01", "2026-03-31")'
  q2-2026-contributions: '(assignee = currentUser() AND resolved >= startOfYear("+3M") AND resolved < startOfYear("+6M")) OR issuekey in updatedBy("MYUSERNAME", "2026-04-01", "2026-06-30")'
  q3-2026-contributions: '(assignee = currentUser() AND resolved >= startOfYear("+6M") AND resolved < startOfYear("+9M")) OR issuekey in updatedBy("MYUSERNAME", "2026-07-01", "2026-09-30")'
  q4-2026-contributions: '(assignee = currentUser() AND resolved >= startOfYear("-3M") AND resolved < startOfYear()) OR issuekey in updatedBy("MYUSERNAME", "2026-10-01", "2026-12-31")'

